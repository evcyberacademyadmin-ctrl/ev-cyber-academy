<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem / Shield Group -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield Frame -->
    <path d="M40 8 L72 22 V52 C72 70 56 82 40 88 C24 82 8 70 8 52 V22 L40 8 Z" 
          fill="#0F172A" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>

    <!-- Inner Cyber Circuit Lines -->
    <path d="M40 18 V34 M25 32 H55 M40 50 V76" 
          stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Electric Voltage / Cyber Bolt Core -->
    <path d="M44 20 L27 46 H42 L36 72 L55 42 H39 L44 20 Z" 
          fill="url(#boltGrad)" />

    <!-- Core Connection Nodes -->
    <circle cx="40" cy="88" r="3" fill="#22D3EE" />
    <circle cx="72" cy="22" r="2.5" fill="#3B82F6" />
    <circle cx="8" cy="22" r="2.5" fill="#3B82F6" />
  </g>

  <!-- Brand Typography -->
  <!-- "EV" -->
  <text x="100" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1">
    EV
  </text>
  
  <!-- "CYBER" -->
  <text x="152" y="44" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="800" font-size="34" fill="#22D3EE" letter-spacing="1.5">
    CYBER
  </text>

  <!-- "ACADEMY" -->
  <text x="101" y="70" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="700" font-size="16" fill="#94A3B8" letter-spacing="6">
    ACADEMY
  </text>

  <!-- Decorative Cyber Line -->
  <rect x="282" y="65" width="40" height="2" fill="#06B6D4" rx="1" opacity="0.8" />
  <circle cx="326" cy="66" r="2" fill="#22D3EE" />
</svg>
